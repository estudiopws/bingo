<style>
        .glass-panel {
            background: rgba(251, 249, 241, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(1, 45, 29, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .pulse-btn {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(1, 45, 29, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(1, 45, 29, 0); }
            100% { box-shadow: 0 0 0 0 rgba(1, 45, 29, 0); }
        }

        .draw-anim {
            animation: drawPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes drawPop {
            0% { transform: scale(1); text-shadow: 0 0 0 rgba(1, 45, 29,0); }
            50% { transform: scale(1.2); text-shadow: 0 0 30px rgba(1, 45, 29,0.5); }
            100% { transform: scale(1); text-shadow: 0 0 15px rgba(1, 45, 29,0.2); }
        }

        .bingo-grid {
            display: grid;
            gap: 8px;
        }

                .bingo-grid__letter {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-radius: 16px;
                        border: 1px solid rgba(1, 45, 29, 0.12);
                        background: linear-gradient(180deg, rgba(1, 45, 29, 0.08), rgba(1, 45, 29, 0.02));
                        color: #012d1d;
                        font-family: Sora, sans-serif;
                        font-size: 1.4rem;
                        font-weight: 700;
                        letter-spacing: 0.18em;
                }

                .info-modal {
                        opacity: 0;
                        visibility: hidden;
                        pointer-events: none;
                        transition: opacity 220ms ease, visibility 220ms ease;
                }

                .info-modal.is-open {
                        opacity: 1;
                        visibility: visible;
                        pointer-events: auto;
                }

                .info-modal__panel {
                        transform: translateY(24px) scale(0.98);
                        opacity: 0;
                        transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), opacity 220ms ease;
                }

                .info-modal.is-open .info-modal__panel {
                        transform: translateY(0) scale(1);
                        opacity: 1;
                }

                .history-list {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
                        gap: 12px;
                }

                .history-pill {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        min-height: 56px;
                        border-radius: 18px;
                        border: 1px solid rgba(1, 45, 29, 0.1);
                        background: rgba(255, 255, 255, 0.72);
                        color: #012d1d;
                        font-size: 1rem;
                        font-weight: 700;
                        letter-spacing: 0.04em;
                }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg text-body-lg overflow-x-hidden">
<header class="flex justify-between items-center w-full px-margin-desktop h-20 bg-surface/90 backdrop-blur-xl docked full-width top-0 z-50 sticky border-b border-outline-variant shadow-sm">
<div class="flex items-center gap-4 text-primary">
<span class="material-symbols-outlined text-3xl">casino</span>
</div>
<div class="text-headline-xl font-headline-xl text-primary tracking-tight">
            BINGO
        </div>
</header>
<main class="flex-grow flex flex-col md:flex-row p-margin-mobile md:p-margin-desktop gap-4 md:gap-6 overflow-hidden items-stretch">
<section class="w-full md:w-3/5 flex flex-col glass-panel rounded-xl p-6 md:p-8 relative min-h-[420px] md:min-h-0">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/5 to-transparent pointer-events-none rounded-xl"></div>
<h2 class="text-headline-lg font-headline-lg text-primary mb-8 flex items-center gap-2">
<span class="material-symbols-outlined text-3xl">grid_on</span>
                TABLERO PRINCIPAL
            </h2>
<div class="flex-grow flex items-center justify-center relative z-10">
<div class="w-full h-full overflow-y-auto pr-2 custom-scrollbar">
<div class="bingo-grid w-full min-w-[660px]" id="master-board"></div>
</div>
</div>
</section>
<div aria-hidden="true" class="relative shrink-0 self-stretch overflow-hidden rounded-full bg-outline-variant/50 h-px w-full md:h-auto md:w-px">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary/50 to-transparent md:bg-gradient-to-b"></div>
</div>
<section class="w-full md:w-2/5 flex flex-col gap-4 md:gap-gutter min-w-0">
<div class="glass-panel rounded-xl flex-grow relative overflow-hidden flex flex-col items-center justify-center min-h-[320px] md:min-h-[350px]">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-primary-container/5 via-background to-background pointer-events-none"></div>
<div class="w-full h-full absolute inset-0 z-0" id="threejs-container"></div>
<div class="relative z-10 mt-auto mb-6 md:mb-8 text-center bg-surface-container-high/90 backdrop-blur-md px-6 md:px-10 py-5 md:py-6 rounded-3xl border border-outline-variant shadow-lg">
<div class="text-label-md font-label-md text-on-surface-variant tracking-[0.1em] mb-2 uppercase">ÚLTIMA BOLA</div>
<div class="text-headline-xl font-headline-xl text-primary" id="last-ball-display">
                        --
                    </div>
</div>
</div>
<div class="glass-panel rounded-xl p-6 md:p-8 flex flex-col gap-5 md:gap-6">
<button class="pulse-btn w-full py-6 rounded-xl bg-primary text-on-primary font-headline-lg text-headline-lg shadow-md transition-transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3 border border-primary-container" id="draw-ball-button" type="button">
<span class="material-symbols-outlined text-4xl">casino</span>
                    SACAR BOLA
                </button>
<div class="grid grid-cols-[1fr_auto] gap-3">
<button class="py-4 rounded-xl bg-surface-container-high hover:bg-surface-variant text-primary border border-outline-variant transition-colors flex items-center justify-center gap-2 font-label-md text-label-md uppercase whitespace-nowrap" id="roll-cage-button" type="button">
<span class="material-symbols-outlined text-2xl">sync</span>
                        GIRAR BOMBO
                    </button>
<button aria-label="Undo" class="row-span-2 w-16 rounded-xl bg-surface-container-high hover:bg-error-container hover:text-on-error-container text-on-surface-variant border border-outline-variant transition-colors flex items-center justify-center" id="undo-button" type="button">
<span class="material-symbols-outlined text-2xl">undo</span>
</button>
<button class="py-4 rounded-xl bg-surface-container-high hover:bg-secondary-container text-primary border border-outline-variant transition-colors flex items-center justify-center gap-2 font-label-md text-label-md uppercase whitespace-nowrap" id="new-game-button" type="button">
<span class="material-symbols-outlined text-2xl">restart_alt</span>
                        NUEVA PARTIDA
                    </button>
</div>
</div>
</section>
</main>
<footer class="flex flex-col md:flex-row justify-between items-center px-margin-desktop py-6 gap-gutter bg-surface-container-lowest/90 backdrop-blur-md docked full-width bottom-0 border-t border-outline-variant">
<div class="flex gap-8 flex-wrap justify-center">
<button class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors uppercase" data-modal-trigger="historial" type="button">HISTORIAL</button>
<button class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors uppercase" data-modal-trigger="reglas" type="button">REGLAS</button>
<button class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors uppercase" data-modal-trigger="probabilidades" type="button">PROBABILIDADES</button>
<button class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors uppercase" data-modal-trigger="ajustes" type="button">AJUSTES</button>
</div>
<div id="footer-signoff">
<a href="https://estudiopws.com" rel="noreferrer" target="_blank" aria-label="Estudio PWS" class="block opacity-70 hover:opacity-100 transition-opacity">
  <img src="https://estudiopws.com/assets/logopws.svg" alt="Estudio PWS" class="h-8 w-auto" />
</a>
</div>
</footer>
<div aria-hidden="true" class="info-modal fixed inset-0 z-[60] flex items-end justify-center p-4 md:items-center md:p-8" id="info-modal">
<button aria-label="Cerrar modal" class="absolute inset-0 bg-primary/20 backdrop-blur-sm" data-modal-close type="button"></button>
<section aria-describedby="info-modal-body" aria-labelledby="info-modal-title" aria-modal="true" class="info-modal__panel glass-panel relative z-10 w-full max-w-3xl overflow-hidden rounded-[32px] border border-outline-variant bg-surface/90 shadow-2xl" role="dialog">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(134,175,153,0.22),_transparent_55%)] pointer-events-none"></div>
<div class="relative z-10 flex items-start justify-between gap-6 border-b border-outline-variant px-6 py-5 md:px-8">
<div>
<p class="text-label-md font-label-md uppercase tracking-[0.2em] text-on-surface-variant">Centro de juego</p>
<h3 class="mt-2 text-headline-lg font-headline-lg text-primary" id="info-modal-title">Historial</h3>
</div>
<button aria-label="Cerrar" class="flex h-12 w-12 items-center justify-center rounded-full border border-outline-variant bg-surface-container-high text-primary transition-transform hover:scale-105" data-modal-close type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="relative z-10 max-h-[70vh] overflow-y-auto px-6 py-6 md:px-8 md:py-8" id="info-modal-body"></div>
</section>
</div>
<script src="/src/main.js" type="module"></script>
</body></html>
